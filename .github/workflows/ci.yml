name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25.3'
    
    - name: Get Go module cache path
      id: gomodcache
      run: echo "path=$(go env GOMODCACHE)" >> $GITHUB_OUTPUT
    
    - name: Cache Go modules
      uses: actions/cache@v4
      with:
        path: ${{ steps.gomodcache.outputs.path }}
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-
    
    - name: Download dependencies
      run: go mod download
    
    - name: Build database rebuild tool
      run: go build -o rebuild_db ./cmd/rebuild_db
    
    - name: Rebuild database with test data
      run: ./rebuild_db -test-ads
      env:
        JWT_SECRET: 'test-jwt-secret-key-for-ci-minimum-32-chars-long'
        MESSAGE_ENCRYPTION_KEY: 'AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA='
        USER_ENCRYPTION_KEY: 'AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA='
    
    - name: Run tests
      run: go test -v ./...
      env:
        JWT_SECRET: 'test-jwt-secret-key-for-ci-minimum-32-chars-long'
        MESSAGE_ENCRYPTION_KEY: 'AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA='
        USER_ENCRYPTION_KEY: 'AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA='
        LOCAL_DEVELOPMENT: 'true'


services:
  redis:
    image: redis:7-alpine
    container_name: rockyads-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: pgvector/pgvector:pg18
    container_name: rockyads-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rockyads
    ports:
      - "5432:5432"
    volumes:
      - rockyads_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    build:
      context: .
      dockerfile: dockerfiles/Dockerfile.minio
    image: rockyads-minio:dev
    container_name: rockyads-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - rockyads_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  jump-server:
    build:
      context: .
      dockerfile: dockerfiles/Dockerfile.jump-server
    image: rockyads-jump-server:dev
    container_name: rockyads-jump-server
    ports:
      - "8000:10000"
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/rockyads?sslmode=disable
      REDIS_URL: redis://redis:6379
      DB_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_HASH_PEPPER: AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE=
      MINIO_API_URL: http://minio:9000
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_BUCKET_NAME: rockyads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./backups:/workspace/backups

  ollama:
    image: ollama/ollama:latest
    container_name: rockyads-ollama
    ports:
      - "11434:11434"
    volumes:
      - rockyads_ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama-pull:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: ollama:11434
    entrypoint: ["/bin/sh", "-c", "ollama pull nomic-embed-text"]
    restart: "no"

volumes:
  rockyads_pgdata:
  rockyads_minio_data:
  rockyads_ollama:

services:
  postgres:
    image: postgres:16
    container_name: rockyads-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rockyads
    ports:
      - "5432:5432"
    volumes:
      - rockyads_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  jump-server:
    build:
      context: .
      dockerfile: dockerfiles/Dockerfile.jump-server
    image: rockyads-jump-server:dev
    container_name: rockyads-jump-server
    ports:
      - "8000:10000"
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/rockyads?sslmode=disable
      USER_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  rockyads_pgdata:
